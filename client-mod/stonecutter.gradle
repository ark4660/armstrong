plugins {
	id 'dev.kikugie.stonecutter'
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// The version the shared src/ is currently written for (what an IDE sees).
// Switch with ./gradlew "Set active project to 1.21.1".
stonecutter.active '26.3'

// ./gradlew buildAll builds the mod for every Minecraft version.
tasks.register('buildAll') {
	group = 'build'
	dependsOn subprojects.collect { "${it.path}:build" }
	dependsOn gradle.includedBuild('1.8.9').task(':build')
}
