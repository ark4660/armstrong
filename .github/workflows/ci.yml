name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: go vet ./... && go test ./...
      - name: Build client mod
        working-directory: client-mod
        run: ./gradlew buildAll --no-daemon
      - name: Build Windows installer
        run: |
          sudo apt-get install -y -qq nsis
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$a go build -o "dist/armstrong-windows-$a.exe" ./cmd/armstrong
          done
          makensis -V2 -DVERSION=0.0.0 -DDIST="$GITHUB_WORKSPACE/dist" -DOUT="$GITHUB_WORKSPACE/dist/ArmstrongSetup.exe" packaging/windows/armstrong.nsi
